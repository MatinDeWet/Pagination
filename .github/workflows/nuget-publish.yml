name: NuGet Publish

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 1.0.0)'
        required: true
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required for GitVersion
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Set version from input or release tag
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          version="${{ github.event.inputs.version }}"
        else
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
        fi

        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid package version: $version"
          exit 1
        fi

        echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release /p:Version=${{ env.PACKAGE_VERSION }} --no-restore
    
    - name: Test
      run: dotnet test --configuration Release --no-build
    
    - name: Pack Pagination
      run: dotnet pack Pagination/Pagination.csproj --configuration Release /p:Version=${{ env.PACKAGE_VERSION }} --no-build --output nupkgs
    
    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: |
          nupkgs/*.nupkg
          nupkgs/*.snupkg
    
    - name: Publish to NuGet
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob

        packages=(nupkgs/*.nupkg nupkgs/*.snupkg)
        if (( ${#packages[@]} == 0 )); then
          echo "No package files found in nupkgs/."
          exit 1
        fi

        for package in "${packages[@]}"; do
          dotnet nuget push "$package" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        done

permissions:
  contents: read